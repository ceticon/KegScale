<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KegScale Main</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- =========================================
             RUBRIK
             ========================================= -->

        <h1>🍺 KegScale</h1>

        <div id="status" class="status">
            Väntar på data...
        </div>


        <!-- =========================================
             ÖL
             ========================================= -->

        <div class="beer-container">

            <div class="beer-title">
                Öl i fatet
            </div>

            <div
                id="beer-display-name"
                class="beer-display-name">
                --
            </div>

        </div>


        <!-- =========================================
             VIKT / VOLYM / FYLLNADSGRAD
             ========================================= -->

        <div class="cards">

            <!-- TOTAL VIKT -->

            <div class="card">

                <div class="label">
                    Total vikt
                </div>

                <div
                    id="weight"
                    class="value">
                    --
                </div>

                <div class="unit">
                    kg
                </div>

            </div>


            <!-- ÖL KVAR -->

            <div class="card">

                <div class="label">
                    Öl kvar
                </div>

                <div
                    id="liters"
                    class="value">
                    --
                </div>

                <div class="unit">
                    liter
                </div>

            </div>


            <!-- FYLLNADSGRAD -->

            <div class="card">

                <div class="label">
                    Fyllnadsgrad
                </div>

                <div
                    id="percent"
                    class="value">
                    --
                </div>

                <div class="unit">
                    %
                </div>

            </div>

        </div>


        <!-- =========================================
             FATNIVÅ
             ========================================= -->

        <div class="level-container">

            <div class="level-title">
                Fatnivå
            </div>

            <div class="level-background">

                <div
                    id="level-bar"
                    class="level-bar">
                </div>

            </div>

        </div>


        <!-- =========================================
             SENASTE UPPDATERING
             ========================================= -->

        <div
            id="timestamp"
            class="timestamp">
            --
        </div>


        <!-- =========================================
             INSTÄLLNINGAR
             ========================================= -->

        <div class="setup-back">

            <a href="/setup">
                ⚙️ Inställningar
            </a>

        </div>

    </div>


    <!-- =============================================
         JAVASCRIPT
         ============================================= -->

    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
